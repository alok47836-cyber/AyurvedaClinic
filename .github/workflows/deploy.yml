name: Build and Deploy .NET App to MonsterASP

on:
  push:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  # JOB 1: Build & Publish .NET App
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Project
        run: dotnet build --configuration Release --no-restore

      - name: Publish .NET Binaries
        run: dotnet publish --configuration Release --no-restore -o ./publish

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: published-app
          path: ./publish

  # JOB 2: Approval Gate & Deploy to MonsterASP via FTP
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: "Alok shukla-dev"

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: published-app
          path: ./app
          merge-multiple: true

      - name: Deploy to MonsterASP Server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: site81405.siteasp.net
          username: site81405
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./app/
          server-dir: /wwwroot/
          protocol: ftp
          port: 21
          security: loose
