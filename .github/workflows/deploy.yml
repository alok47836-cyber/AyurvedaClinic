name: Build and Deploy .NET App to MonsterASP

on:
  push:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  # JOB 1: Build & Publish .NET App
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Project
        run: dotnet build --configuration Release --no-restore

      - name: Publish .NET Binaries
        run: dotnet publish --configuration Release --no-restore -o ./publish

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: published-app
          path: ./publish

  # JOB 2: Manual Approval Gate & MonsterASP WebDeploy
  deploy:
    needs: build
    runs-on: windows-latest
    environment: "Alok shukla-dev"

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: published-app
          path: .\app
          merge-multiple: true

      - name: Deploy via MSDeploy (WebDeploy)
        shell: powershell
        run: |
          $msdeployPath = "C:\Program Files\IIS\Microsoft Web Deploy v3\msdeploy.exe"
          if (-not (Test-Path $msdeployPath)) {
            $msdeployPath = "C:\Program Files (x86)\IIS\Microsoft Web Deploy v3\msdeploy.exe"
          }

          $destUrl = "https://${{ secrets.MSDEPLOY_COMPUTER_NAME }}:8172/msdeploy.axd?site=${{ secrets.MSDEPLOY_SITE_NAME }}"

          & $msdeployPath -verb:sync `
            -source:contentPath="$(Get-Location)\app" `
            -dest:contentPath="${{ secrets.MSDEPLOY_SITE_NAME }}",computerName="$destUrl",userName="${{ secrets.MSDEPLOY_USERNAME }}",password="${{ secrets.MSDEPLOY_PASSWORD }}",authtype="Basic",includeAcls="False" `
            -allowUntrusted `
            -disableLink:AppPoolExtension `
            -disableLink:ContentExtension `
            -disableLink:CertificateExtension
