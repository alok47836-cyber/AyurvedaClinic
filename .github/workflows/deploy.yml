name: Build and Deploy .NET App to MonsterASP

on:
  push:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Project
        run: dotnet build --configuration Release --no-restore

      - name: Publish .NET Binaries
        run: dotnet publish --configuration Release --no-restore -o ./publish

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: published-app
          path: ./publish

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: "Alok shukla-dev"

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: published-app
          path: ./app
          merge-multiple: true

      - name: Deploy using WebDeploy
        uses: runcal/publish-profile-deploy@v1
        with:
          publish-profile: ${{ secrets.MONSTERASP_PUBLISH_PROFILE }}
          source-path: ./app
